<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Explorer — Bastos Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="stamp-icon">BE</span> Bastos Explorer</a>
    <div class="nav-links">
      <a href="explore.html" class="active" data-i18n="navExplore">Explorer</a>
      <a href="about.html" data-i18n="navAbout">À propos</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="langToggle" onclick="toggleLanguage()" aria-label="Changer de langue">FR</button>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Changer de thème">🌙</button>
      <span id="navAuthSlot"></span>
    </div>
  </div>
</nav>

<header class="hero" style="padding-bottom:36px;">
  <div class="hero-inner">
    <div class="eyebrow">Le carnet</div>
    <h1 style="font-size:clamp(30px,4vw,44px);" data-i18n="heroTitleExplore">Explorer Bastos</h1>
    <p data-i18n="heroSubExplore">Filtrez par catégorie, cherchez par nom, ou triez par distance depuis votre position.</p>
  </div>
</header>

<main class="wrap" style="padding-top:26px;">
  <div id="weatherWidget"></div>

  <div class="search-row">
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Chercher un lieu (nom, description)…">
    <select id="sortSelect">
      <option value="name" data-i18n="sortName">Trier : Nom</option>
      <option value="rating" data-i18n="sortRating">Trier : Mieux notés</option>
      <option value="distance" data-i18n="sortDistance">Trier : Distance (ma position)</option>
    </select>
    <button class="btn secondary" onclick="useMyLocationForSort()" data-i18n="myLocation">📍 Ma position</button>
    <button class="btn secondary" id="favoritesToggle" data-i18n="favoritesOnly">♥ Mes favoris</button>
    <button class="btn secondary" id="surpriseBtn" data-i18n="surpriseMe">🎲 Surprends-moi</button>
  </div>

  <div class="filters" id="categoryChips"></div>

  <div class="grid" id="placeGrid"></div>
</main>

<footer>Bastos Explorer · Carnet de quartier · Flask + JSON storage</footer>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>document.addEventListener("DOMContentLoaded", initExplorePage);</script>
</body>
</html>
