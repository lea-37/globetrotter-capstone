<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lieu — Bastos Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="stamp-icon">BE</span> Bastos Explorer</a>
    <div class="nav-links">
      <a href="explore.html" data-i18n="navExplore">Explorer</a>
      <a href="about.html" data-i18n="navAbout">À propos</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="langToggle" onclick="toggleLanguage()" aria-label="Changer de langue">FR</button>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Changer de thème">🌙</button>
      <span id="navAuthSlot"></span>
    </div>
  </div>
</nav>

<main class="wrap" style="padding-top:34px;">
  <a href="explore.html" class="hint" style="text-decoration:none;" data-i18n="back">← Retour au carnet</a>

  <div id="placeDetail" style="margin-top:14px;">
    <div class="hint">Chargement du lieu…</div>
  </div>

  <div id="weatherWidget" style="margin-top:8px;"></div>

  <div class="two-col" style="margin-top:10px;">
    <div>
      <h2 class="section-title" style="margin-top:0;font-size:20px;" data-i18n="mapTitle">Carte &amp; itinéraire</h2>
      <div class="map-box" id="placeMap"></div>
      <button class="btn secondary" id="directionsBtn" style="margin-top:14px;" data-i18n="directionsBtn">📍 Itinéraire depuis ma position</button>
      <div id="routeInfo"></div>
    </div>

    <div>
      <h2 class="section-title" style="margin-top:0;font-size:20px;" data-i18n="reviewsTitle">Avis</h2>
      <div class="card" style="padding:16px 18px;margin-bottom:18px;">
        <form id="reviewForm">
          <div class="error-msg" id="reviewError"></div>
          <div class="field">
            <label for="reviewRating">Note</label>
            <select id="reviewRating">
              <option value="5">★★★★★ — Excellent</option>
              <option value="4">★★★★☆ — Très bien</option>
              <option value="3">★★★☆☆ — Correct</option>
              <option value="2">★★☆☆☆ — Moyen</option>
              <option value="1">★☆☆☆☆ — Décevant</option>
            </select>
          </div>
          <div class="field">
            <label for="reviewComment" data-i18n="reviewLabel">Votre avis</label>
            <textarea id="reviewComment" rows="3" required data-i18n-placeholder="reviewPlaceholder" placeholder="Partagez votre expérience…"></textarea>
          </div>
          <button class="btn" type="submit" data-i18n="publish">Publier l'avis</button>
        </form>
      </div>
      <div id="reviewsList"></div>
    </div>
  </div>
</main>

<footer>Bastos Explorer · Carnet de quartier · Flask + JSON storage</footer>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
<script>document.addEventListener("DOMContentLoaded", initPlacePage);</script>
</body>
</html>
